openapi: "3.1.0"
info:
  title: imajin-app-template
  version: "0.1.0"
  description: >
    A third-party app on Imajin. This spec is served by the app itself at
    /api/spec and aggregated by the kernel's service registry, the same way
    every other app on the platform is discovered.

servers:
  - url: http://localhost:3000
    description: local

tags:
  - name: app-template

components:
  securitySchemes:
    kernelSignature:
      type: apiKey
      in: header
      name: x-kernel-signature
      description: Ed25519 kernel signature; all five x-kernel-* headers below are required.
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /api/build:
    get:
      operationId: getBuild
      summary: Immutable public build provenance (also available before claiming)
      tags: [app-template]
      security: []
      responses:
        "200":
          description: The same build metadata displayed in the footer
          content:
            application/json:
              schema:
                type: object
                required: [version, sha, repo, builtAt]
                additionalProperties: false
                properties:
                  version:
                    type: string
                    description: Nearest reachable v-prefixed release tag without v, or package.json version
                  sha:
                    type: string
                    description: Commit SHA (full when derived from git), or local for an untagged/tarball build
                  repo:
                    type: string
                    description: GitHub owner/name from NEXT_PUBLIC_SOURCE_REPO or origin; empty if unavailable
                  builtAt:
                    type: string
                    format: date-time
                    description: Build timestamp, not request time
  /api/webhooks/kernel:
    post:
      operationId: postKernelWebhook
      summary: Example verified kernel notification receiver
      description: >
        The kernel signs; the app verifies raw bytes before parsing or handler effects.
        Audience must equal this deployment's IMAJIN_APP_DID. Timestamp freshness is
        inclusive +/-300 seconds and each nonce is accepted once per process.
        The template handler is a no-op; forks validate payloads and wire domain handlers.
        The app must be claimed first. Proxies must preserve the signed external path/query.
      tags: [app-template]
      security:
        - kernelSignature: []
      parameters:
        - name: x-kernel-audience
          in: header
          required: true
          schema: { type: string }
          description: Recipient app DID, not the app-token slug.
        - name: x-kernel-kid
          in: header
          required: true
          schema: { type: string }
          description: Active kernel signing key identifier from trusted public discovery.
        - name: x-kernel-timestamp
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9]+$" }
          description: Unix timestamp in seconds.
        - name: x-kernel-nonce
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: x-kernel-signature
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{128}$" }
          description: Detached Ed25519 signature over audience, freshness, nonce, method, path/query and exact body bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: Verified JSON handed to the example no-op handler
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
        "400":
          description: Signed body is not valid JSON
        "401":
          description: Unsigned, invalid, stale, future, replayed, tampered or wrong-audience notification
        "503":
          description: Verification unavailable (discovery, trust or store failure); no handler effects
        "500":
          description: Handler failed after verification
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [app-template]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: imajin-app-template }
                  timestamp: { type: string, format: date-time }
                  claimed:
                    type: boolean
                    description: >
                      False in unclaimed boot mode (#2427) — this app has no
                      signing identity yet. See /claim.

  /api/claim:
    post:
      operationId: postClaim
      summary: Redeem this app's one-time claim code (operator-only, unclaimed boot mode)
      description: >
        Backs the operator-facing /claim page. Exchanges the one-time claim
        code from the kernel's /jin approval card for this app's signing
        key, persists the local bootstrap keystore, and hot-swaps the
        in-memory signing identity. Returns 404 once this app has already
        been claimed.
      tags: [app-template]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimCode]
              properties:
                claimCode: { type: string }
      responses:
        "200":
          description: Claim redeemed
          content:
            application/json:
              schema:
                type: object
                properties:
                  appDid: { type: string }
                  publicKey: { type: string, nullable: true }
        "400":
          description: Invalid or refused claim code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: This app has already been claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many claim attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/me:
    get:
      operationId: getMe
      summary: Return the signed-in caller's DID
      tags: [app-template]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The caller's DID
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
