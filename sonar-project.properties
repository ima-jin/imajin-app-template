# Committed for the template itself (ima-jin/imajin-app-template). Forks: update
# sonar.projectKey (and sonar.organization if you're not under ima-jin) to match
# the Sonar project Ryan creates for your repo — see .github/workflows/sonarcloud.yml.
sonar.organization=ima-jin
sonar.projectKey=ima-jin_imajin-app-template

# relative paths to source directories — a Next.js fork typically narrows this to
# `src`; the bare template has no src/ yet, so scan the repo root.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/migrations/**

# Populated by the Test job when a fork has one; harmless (0% new-code coverage
# reported, not a scan failure) when the report doesn't exist yet.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is not required for: build/config files (not app logic), the
# instrumentation boot-check (a one-line env guard, no branch logic worth a
# process-exit test), React UI shells (layout/page/providers/auth-status —
# presentational, no business logic), drizzle schema/db wiring (exercised
# against a real Postgres instance, not unit-testable without one), and the
# @ima-jin/auth-client route wrappers that are pure one-line delegations to
# the published SDK (testing them tests the SDK, not this app). `/api/health`,
# `/api/spec`, and `/api/me` — the routes with actual app logic — are unit
# tested and counted normally.
sonar.coverage.exclusions=**/*.config.js,**/*.config.ts,instrumentation.ts,app/layout.tsx,app/page.tsx,app/providers.tsx,app/globals.css,src/components/**,src/db/**,app/api/auth/**
