name: SonarCloud

# Mirrors the shape of ima-jin/imajin-ai's blocking `sonarcloud` CI job
# (ima-jin/imajin-app-template#3): same zero-new-issues quality gate, no
# `continue-on-error`. Runs unconditionally, on the bare scaffold and on a
# filled-in fork alike — see .github/workflows/ci.yml's own detect-app guard
# for why that split exists there but not here: a Sonar scan of a handful of
# markdown/config files is cheap and still worth gating on.
#
# Requires two manual, one-time steps from a repo admin before this goes
# green (tracked in the PR that introduced this file):
#   1. Create the Sonar project on sonarcloud.io for this repo
#      (sonar.organization/sonar.projectKey in sonar-project.properties).
#   2. Add SONAR_TOKEN as a repo or org secret.
# Until both exist, this check fails on purpose. A green check that scanned
# nothing is a worse signal than a red one that says why.
#
# Fork-PR fix (ima-jin/dykil#4): a plain `pull_request` trigger never sees
# repo/org secrets when the PR comes from a fork, so SONAR_TOKEN would be
# empty and this job would always fail on fork PRs — and fork-and-PR is the
# standard contribution path here, including for Jin.
#
# `pull_request_target` runs in the BASE repo's context instead, so secrets
# are available — but a first attempt at this fix that checked out the PR's
# own head SHA from a `pull_request_target`-triggered job was flagged by
# CodeQL as a CRITICAL "checkout of untrusted code in a privileged context"
# vulnerability (a malicious PR's checked-out files sit on disk next to
# SONAR_TOKEN, one misbehaving analyzer/plugin away from exfiltrating it —
# the classic "pwn request"). GitHub's own guidance for exactly this case is
# `workflow_run`: the PR's own code is built ONLY in the unprivileged
# `pull_request`-triggered `CI` workflow (ci.yml — no secrets, so running
# PR-authored code there is safe), which packages the result (source +
# coverage + PR metadata) as a build artifact. This privileged workflow reacts
# to that workflow's completion and ONLY downloads the artifact — it never
# runs `actions/checkout` on the PR's ref, and never executes any PR-authored
# script itself.
#
# Trusted scanner configuration (ima-jin/imajin-app-template#15): the artifact
# is still PR-authored, so the scanner must never trust anything in it that
# steers where SONAR_TOKEN goes. The privileged job therefore (1) overwrites the
# payload's sonar-project.properties with the default branch's copy (sparse
# checkout of that one file — no PR code), (2) passes the server URLs,
# organization and projectKey as -D args (hardcoded / read from that trusted
# copy, never from the payload; CLI beats any file), (3) validates the PR head
# SHA and passes it as sonar.scm.revision, and (4) scans with
# SonarSource/sonarqube-scan-action pinned by commit SHA. The `run:` blocks of
# the steps below are executed against a hostile payload fixture by
# scripts/check-sonar-trust.sh (.github/workflows/sonar-trust-check.yml).

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read # to download the sonar-payload artifact from the triggering CI run

jobs:
  sonarcloud-push:
    if: github.event_name == 'push'
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the scanner can assign blame and compute new-code accurately.
          fetch-depth: 0

      - name: Detect app
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "No package.json (scaffold-only template) — skipping coverage generation."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.has_app == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.has_app == 'true'
        # --ignore-scripts: this job only needs to run the test suite for
        # coverage, not build native addons — no lifecycle script here is
        # required for `pnpm run test:coverage` to succeed (verified locally).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate coverage
        # Populates coverage/lcov.info (sonar.javascript.lcov.reportPaths). A
        # failing suite short-circuits the scan, which is fine — the gate
        # would be judging an incomplete picture anyway.
        if: steps.detect.outputs.has_app == 'true'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:coverage'] ? 0 : 1)"; then
            pnpm run test:coverage
          else
            echo "No test:coverage script — skipping (Sonar reports 0% new-code coverage)."
          fi

      - name: Require SONAR_TOKEN
        # A missing token must not be a silent pass — see the header comment.
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::error::SONAR_TOKEN is not set. A repo admin must create the Sonar project on sonarcloud.io for this repo and add SONAR_TOKEN as a repo/org secret (see sonar-project.properties)."
          exit 1

      - name: SonarCloud Scan
        # Archived/deprecated upstream (SonarSource redirected it to
        # sonarqube-scan-action), but pinned to its last release by commit SHA it
        # remains a thin, stable wrapper around that action — kept here because
        # it's the action named for this template's CI-parity work.
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud-pr:
    # Only for the CI workflow's own `pull_request` runs, and only once it
    # succeeded — a failing build/test means an incomplete picture (same
    # reasoning as the push job's coverage step above).
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Require SONAR_TOKEN
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::error::SONAR_TOKEN is not set. A repo admin must create the Sonar project on sonarcloud.io for this repo and add SONAR_TOKEN as a repo/org secret (see sonar-project.properties)."
          exit 1

      - name: Download Sonar payload
        # No actions/checkout here on purpose — see the header comment. This
        # downloads only the artifact ci.yml's unprivileged job already built.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sonar-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sonar-payload

      - name: Read PR metadata
        id: pr
        # Fails loudly on missing/odd metadata: with empty sonar.pullrequest.*
        # args the scanner silently falls back to a MAIN-branch analysis, which
        # overwrites main with PR code (ima-jin/imajin-app-template#10).
        # The file comes from an artifact built by PR-authored code, so treat
        # every value as untrusted and allow-list its characters before it
        # reaches the scanner args.
        run: |
          meta=sonar-payload/sonar-pr-meta.json
          if [ ! -s "$meta" ]; then
            echo "::error::$meta missing or empty — refusing to run a Sonar scan without PR parameters (it would upload as a main-branch analysis)."
            exit 1
          fi
          number=$(jq -r '.prNumber // empty' "$meta")
          headRef=$(jq -r '.headRef // empty' "$meta")
          baseRef=$(jq -r '.baseRef // empty' "$meta")
          headSha=$(jq -r '.headSha // empty' "$meta")
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number in metadata."
            exit 1
          fi
          # The payload has no .git, so the scanner can't discover the revision
          # itself; it is passed as -Dsonar.scm.revision. Exactly 40 hex chars.
          if ! [[ "$headSha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Missing or invalid head SHA in PR metadata (expected exactly 40 hex characters)."
            exit 1
          fi
          for ref in "$headRef" "$baseRef"; do
            if ! [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::Missing or unsafe branch name in PR metadata."
              exit 1
            fi
          done
          {
            echo "number=$number"
            echo "headRef=$headRef"
            echo "baseRef=$baseRef"
            echo "headSha=${headSha,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout trusted Sonar properties
        # Default branch only, and ONLY this one file (sparse checkout) — still
        # no PR code on disk. Written to its own directory, outside the payload.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: sonar-project.properties
          sparse-checkout-cone-mode: false
          path: sonar-trusted
          persist-credentials: false

      - name: Pin trusted scanner properties
        id: scan_args
        # 1. Replace the PR-authored sonar-project.properties with the default
        #    branch's copy (rm first so a symlink in the artifact can't redirect
        #    the write).
        # 2. Build the -D args. organization/projectKey come from the TRUSTED
        #    file and are allow-listed; the server URLs are literals. Nothing
        #    from the payload decides where the token is sent or which project
        #    is written to.
        # PR values were validated by the `pr` step; they reach this script via
        # env: only (never interpolated into the script text).
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_REF: ${{ steps.pr.outputs.headRef }}
          PR_BASE_REF: ${{ steps.pr.outputs.baseRef }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.headSha }}
        run: |
          trusted=sonar-trusted/sonar-project.properties
          payload=sonar-payload/sonar-project.properties
          if [ ! -s "$trusted" ]; then
            echo "::error::Trusted $trusted missing or empty on the default branch — refusing to scan."
            exit 1
          fi
          read_prop() {
            awk -v k="$1" '
              /^[[:space:]]*[#!]/ { next }
              {
                i = index($0, "=")
                if (i == 0) next
                key = substr($0, 1, i - 1); gsub(/[[:space:]]/, "", key)
                if (key == k) { v = substr($0, i + 1); gsub(/^[[:space:]]+|[[:space:]]+$/, "", v); val = v }
              }
              END { print val }' "$trusted"
          }
          org=$(read_prop sonar.organization)
          key=$(read_prop sonar.projectKey)
          for v in "$org" "$key"; do
            if ! [[ "$v" =~ ^[A-Za-z0-9._:-]+$ ]]; then
              echo "::error::sonar.organization/sonar.projectKey missing or unsafe in the trusted $trusted."
              exit 1
            fi
          done
          rm -f "$payload"
          cp "$trusted" "$payload"
          host=https://sonarcloud.io
          args="-Dsonar.host.url=$host -Dsonar.scanner.sonarcloudUrl=$host"
          args="$args -Dsonar.organization=$org -Dsonar.projectKey=$key"
          args="$args -Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$PR_HEAD_REF"
          args="$args -Dsonar.pullrequest.base=$PR_BASE_REF -Dsonar.scm.revision=$PR_HEAD_SHA"
          echo "Effective Sonar scanner args: $args"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        # No GITHUB_TOKEN on purpose: PR decoration is done server-side by the
        # SonarCloud GitHub App, and every PR parameter is passed explicitly in
        # `args` (the payload has no .git to discover them from). The scanner
        # therefore sees SONAR_TOKEN only, and the token only goes to the
        # hardcoded sonarcloud.io URLs in `args`.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: sonar-payload
          args: ${{ steps.scan_args.outputs.args }}
