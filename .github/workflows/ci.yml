name: CI

# Generic CI for Imajin app-template forks.
#
# Design constraints (see ima-jin/conventions §7):
#   - Must be valid in the BARE template (scaffold-only: no package.json yet)
#     AND real in a filled-in fork (xprize, scorecard, …). So every JS step is
#     guarded: no package.json -> skip test/build, still run the markdown check.
#   - Package-manager agnostic: detect npm / pnpm / yarn from the lockfile.
#     (xprize is npm; other apps may differ — do NOT hard-code pnpm.)
#   - The markdown control-char check ALWAYS runs — it needs no app code and is
#     the mechanical enforcement of the "file-based issue/PR bodies" rule
#     (conventions §7). It catches bodies mangled by inline `gh --body` escaping
#     (BEL 0x07, form-feed 0x0C, lone CR) before they merge.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-sanity:
    name: Markdown control-char check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fail on control characters in tracked markdown
        run: |
          # BEL (0x07) and form-feed (0x0C) never belong in prose; a lone CR
          # (0x0D not followed by 0x0A) is the fingerprint of inline-body escaping.
          # These are the exact artifacts inline `gh --body` produced on PR #27.
          hits=$(grep -rlP '[\x07\x0c]|\r(?!\n)' --include='*.md' . || true)
          if [ -n "$hits" ]; then
            echo "::error::Control characters found in markdown (likely an inline 'gh --body' mangle — use --body-file). Files:"
            echo "$hits"
            exit 1
          fi
          echo "Markdown clean — no BEL/form-feed/lone-CR control characters."

  test-build:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect app
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "No package.json (scaffold-only template) — skipping test/build."
          fi

      - name: Detect package manager
        id: pm
        if: steps.detect.outputs.has_app == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.has_app == 'true' && steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.pm.outputs.pm }}

      - name: Install
        if: steps.detect.outputs.has_app == 'true'
        # --ignore-scripts: no dependency lifecycle script runs in CI. None is
        # required to lint, typecheck, test or build this app (verified: the
        # full suite passes with scripts disabled). A fork that adds a package
        # which genuinely needs one (a native addon's postinstall, say) should
        # run exactly that script explicitly after install and say why here —
        # not drop the flag.
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile --ignore-scripts ;;
            yarn) yarn install --frozen-lockfile --ignore-scripts ;;
            npm)  npm ci --ignore-scripts ;;
          esac

      - name: Test
        if: steps.detect.outputs.has_app == 'true'
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            "$PM" run test
          else
            echo "No test script — skipping."
          fi

      - name: Build
        if: steps.detect.outputs.has_app == 'true'
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            "$PM" run build
          else
            echo "No build script — skipping."
          fi

      - name: Lint (optional)
        if: steps.detect.outputs.has_app == 'true'
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            "$PM" run lint
          else
            echo "No lint script — skipping."
          fi

      - name: Typecheck (optional)
        if: steps.detect.outputs.has_app == 'true'
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            "$PM" run typecheck
          else
            echo "No typecheck script — skipping."
          fi

      - name: Generate coverage (for the SonarCloud workflow)
        if: steps.detect.outputs.has_app == 'true' && github.event_name == 'pull_request'
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:coverage'] ? 0 : 1)"; then
            "$PM" run test:coverage
          else
            echo "No test:coverage script — skipping (Sonar reports 0% new-code coverage)."
          fi

      - name: Package Sonar payload
        # This job runs on plain `pull_request` — no secrets, so it's safe to
        # run PR-authored code here (already did, above). The privileged
        # SonarCloud workflow (has SONAR_TOKEN, triggered by `workflow_run` on
        # THIS workflow's completion — see ima-jin/dykil#4) never checks out
        # or executes PR code itself; it only downloads this pre-built,
        # already-safe snapshot. That split is what keeps a fork PR's
        # SONAR_TOKEN-holding job free of the classic "checkout of untrusted
        # code in a privileged context" vulnerability (flagged by CodeQL on
        # an earlier version of this fix that checked out the PR head
        # directly from a pull_request_target-triggered job).
        if: github.event_name == 'pull_request'
        # Untrusted event context (branch names are attacker-controlled) goes
        # through env: and is quoted in the script — never interpolated with
        # ${{ }} inside run:. jq does the JSON escaping.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p /tmp/sonar-payload
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.imajin' ./ /tmp/sonar-payload/
          # NOT a dotfile: upload-artifact@v4 skips hidden files by default, which
          # silently dropped this file and made every PR scan upload as a main
          # analysis (empty sonar.pullrequest.* args).
          jq -n \
            --argjson prNumber "$PR_NUMBER" \
            --arg headSha "$PR_HEAD_SHA" \
            --arg headRef "$PR_HEAD_REF" \
            --arg baseRef "$PR_BASE_REF" \
            '{prNumber: $prNumber, headSha: $headSha, headRef: $headRef, baseRef: $baseRef}' \
            > /tmp/sonar-payload/sonar-pr-meta.json

      - name: Upload Sonar payload
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-payload
          path: /tmp/sonar-payload
          retention-days: 1
          if-no-files-found: error

  registry-install:
    # Proof that this app consumes @ima-jin/* (and everything else) from the
    # public npm registry, like any outside party (ima-jin/imajin-ai#1982):
    # a from-scratch install — no dependency cache, no auth token, no
    # .npmrc redirect — must succeed, and every @ima-jin/* package must then
    # resolve into pnpm's store rather than a workspace link. The static half
    # (scripts/check-registry-deps.mjs) also rejects workspace:/link:/file:
    # specifiers and the monorepo-internal @imajin/* scope.
    name: Clean registry install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect app
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "No package.json (scaffold-only template) — skipping registry install proof."
          fi

      - name: Detect package manager
        id: pm
        if: steps.detect.outputs.has_app == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.has_app == 'true' && steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node (deliberately no dependency cache)
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Static check — registry specifiers only
        if: steps.detect.outputs.has_app == 'true'
        run: node scripts/check-registry-deps.mjs

      - name: Clean install from the public registry
        if: steps.detect.outputs.has_app == 'true'
        env:
          PM: ${{ steps.pm.outputs.pm }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile --ignore-scripts ;;
            yarn) yarn install --frozen-lockfile --ignore-scripts ;;
            npm)  npm ci --ignore-scripts ;;
          esac

      - name: Installed check — @ima-jin/* resolved from the registry store
        if: steps.detect.outputs.has_app == 'true'
        run: node scripts/check-registry-deps.mjs --installed
